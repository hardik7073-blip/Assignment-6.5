
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile Card</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="profile-card">
        <span class="profile-badge">Available</span>

        <img
            src="https://i.pravatar.cc/150?img=12"
            alt="Profile picture"
            class="profile-image"
        >

        <h2 class="profile-name">Hardik Patel</h2>
        <p class="profile-role">Web Development Student</p>

        <p class="profile-description">
            I enjoy building websites and learning new technologies.
            Currently improving my HTML, CSS, JavaScript and Java skills.
        </p>

        <div class="profile-skills">
            <span>HTML</span>
            <span>CSS</span>
            <span>JavaScript</span>
            <span>Java</span>
        </div>

        <a href="mailto:your-email@example.com" class="contact-button">
            Contact Me
        </a>
    </div>

</body>
</html>
